otel:
  logs:
    exporter: none
  metrics:
    exporter: none
  traces:
    exporter: none
server:
  port: 9091
database.type: datastore
dlc:
  csv:
    local:
      sources:
        default:
          root-base-dir: ./src/main/resources/data/#{COB_DATE}

  jdbc:
    sources:
      local-dremio:
        driver-class: org.apache.arrow.driver.jdbc.ArrowFlightJdbcDriver
        url: "jdbc:arrow-flight-sql://localhost:32010/?useEncryption=false&schema=nessie"
        username: "admin"
        password: "admin12345"
        accepts-topic-overrides: true
cob-dates:
  source: default
  days-in-memory: 0
  fixed-cob-dates: 2019-01-01,2019-01-02