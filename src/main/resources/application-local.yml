otel:
  logs:
    exporter: none
  metrics:
    exporter: none
  traces:
    exporter: none
distribution.type: none
database:
  type: datastore
  dremio:
    connection-string: "jdbc:arrow-flight-sql://localhost:32010/?useEncryption=false&schema=nessie"
    database: "nessie"
    schema: "nessie"
dlc:
  jdbc:
    sources:
      Dremio:
        driver-class: org.apache.arrow.driver.jdbc.ArrowFlightJdbcDriver
        url: ${database.dremio.connection-string}
        username: "admin"
        password: "admin12345"
        accepts-topic-overrides: true
