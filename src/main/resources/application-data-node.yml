server:
  port: ${SERVER_PORT:9090}

# Priority used by the query node's data-overlap dispatching when several data nodes carry the same
# (replicated) data - see QueryCubeConfig. Every data-node instance should keep the same value so the
# query node picks between them at random for high availability instead of preferring one permanently.
data-node:
  priority: ${DATA_NODE_PRIORITY:1}

# Aggregate-provider sub-test switch for the HA rehearsal (see DataCubeConfig.AggregateProviderMode):
# SINGLE (default, current baseline) | SINGLE_PARTITIONED | PARTIAL_BY_DATE. partition-dates is only read
# for PARTIAL_BY_DATE, as a comma-separated list of ISO dates (e.g. "2019-01-05,2019-01-06,...").
aggregate-provider:
  mode: ${AGGREGATE_PROVIDER_MODE:SINGLE}
  partition-dates: ${AGGREGATE_PROVIDER_PARTITION_DATES:}

# DirectQuery connection to Dremio (Trades/TradeAttributes datasets)
dremio:
  host: ${DREMIO_HOST:localhost}
  port: ${DREMIO_PORT:32010}
  username: ${DREMIO_USERNAME}
  password: ${DREMIO_PASSWORD}
  space: "${DREMIO_SPACE:@gba}"
  use-encryption: false
