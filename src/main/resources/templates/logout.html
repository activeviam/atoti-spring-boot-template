<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Logout Page</title>
    <style>
        body {
            font-family: "Roboto", sans-serif;
        }

        .logout-page {
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .atoti-logo {
            width: 350px;
            flex-grow: 0;
        }

        .logout-message-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 4px;
            justify-content: space-between;
            padding: 9px 16px;
            border-radius: 2px;
            border: 1px solid #b7eb8f;
            background: #f6ffed;
        }

        .check-icon {
            width: 16px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="logout-page">
    <img alt="atoti-logo" class="atoti-logo" th:src="@{'/logo-logout'}"/>

    <div class="logout-message-container">
        <div class="check-icon">
            <svg class="check-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                <path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"
                      fill="#fff"/>
                <path d="M512 140c-205.4 0-372 166.6-372 372s166.6 372 372 372 372-166.6 372-372-166.6-372-372-372zm193.4 225.7l-210.6 292a31.8 31.8 0 0 1-51.7 0L318.5 484.9c-3.8-5.3 0-12.7 6.5-12.7h46.9c10.3 0 19.9 5 25.9 13.3l71.2 98.8 157.2-218c6-8.4 15.7-13.3 25.9-13.3H699c6.5 0 10.3 7.4 6.4 12.7z"
                      fill="#52C41A"/>
                <path d="M699 353h-46.9c-10.2 0-19.9 4.9-25.9 13.3L469 584.3l-71.2-98.8c-6-8.3-15.6-13.3-25.9-13.3H325c-6.5 0-10.3 7.4-6.5 12.7l124.6 172.8a31.8 31.8 0 0 0 51.7 0l210.6-292c3.9-5.3.1-12.7-6.4-12.7z"
                      fill="#fff"/>
            </svg>
        </div>
        <div>You have successfully logged out.</div>
    </div>
</div>
</body>
</html>
