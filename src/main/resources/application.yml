# Spring Boot server port and compression
server:
  port: 9090
  compression:
    enabled: true
    mime-types: application/json,application/xml,application/javascript,text/html,text/xml,text/plain,text/css,text/javascript,image/jpeg,image/png,image/svg+xml
  servlet:
    session:
      cookie:
        http-only: true
        same-site: NONE
        secure: true
        name: ATOTISERVER_JSESSIONID
spring:
  application:
    name: "atoti-spring-boot"
  main:
    banner-mode: log
    allow-bean-definition-overriding: true
  jmx.enabled: true
  output:
    ansi:
      enabled: ALWAYS
  threads:
    virtual:
      enabled: true

# Spring Boot actuator config
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      access: unrestricted
  health:
    elasticsearch.enabled: false
  # https://docs.spring.io/spring-boot/reference/actuator/tracing.html
  tracing:
    sampling:
      probability: 1
springdoc:
  swagger-ui:
    doc-expansion: none
otel:
  metric:
    export:
      interval: 1s
  traces:
    sampler: always_on
  resource:
    attributes:
      '[service.name]': ${spring.application.name}
      '[service.version]': 1.0

