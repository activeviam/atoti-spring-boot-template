# Spring Boot server port and compression
server:
  port: 9090
  compression:
    enabled: true
    mime-types: application/json,application/xml,application/javascript,text/html,text/xml,text/plain,text/css,text/javascript,image/jpeg,image/png,image/svg+xml
  servlet:
    session:
      cookie:
        http-only: true
        same-site: NONE
        secure: true
        name: ATOTISERVER_JSESSIONID

spring:
  application:
    name: "atoti-spring-boot"
  main:
    banner-mode: log
    allow-bean-definition-overriding: true
  jmx.enabled: true
  output:
    ansi:
      enabled: ALWAYS
  threads:
    virtual:
      enabled: true

# Spring Boot actuator config
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    elasticsearch.enabled: false
  # https://docs.spring.io/spring-boot/reference/actuator/tracing.html
  tracing:
    sampling:
      probability: 1

otel:
  metric:
    export:
      interval: 1s
  traces:
    sampler: always_on
  resource:
    attributes:
      '[service.name]': ${spring.application.name}
      # Getting the version from the Maven properties
      '[service.version]': @project.version@
  instrumentation:
    logback-appender:
      experimental:
        capture-marker-attribute: true
        capture-key-value-pair-attributes: true
        capture-code-attributes: true
        capture-logger-context-attributes: true
        capture-mdc-attributes: "*"
      experimental-log-attributes: true

dlc:
  csv:
    implicit-topics-enabled: false

# Security configuration
security:
  authentication:
    in-memory:
      users:
        - username: admin
          password: "{bcrypt}$2a$10$MbL1N4JogTOrDnnnTGYKQuqeKFa8TaC1fPTiC7GykIo2L12pODrKC"
          authorities:
            - ROLE_USER
            - ROLE_ADMIN
            - ROLE_CS_ROOT
  tech-user:
    passwords:
      pivot: "{bcrypt}$2a$10$87iR319r7HvSvs5k9.jutuDzjuKqO6riilSjl/9u2LGDpn4/7.1he"
      sba: "{bcrypt}$2a$10$QX8Im2Qh3s/qS9ypLlpEnuaVXtQTUz1XNS7goa9Ya7ofcZyuo2IdW"


# Properties used to configure the authentication based on JWT.
# You can execute JwtUtil to generate new keys.

atoti:
  server:
    # Enable Dr.Pivot
    endpoint:
      database:
        security:
          enabled: true
      diagnostics:
        enabled: true
    security:
      cookie-name: ${server.servlet.session.cookie.name}
    content-service:
      enabled-type: database
      database:
        # Content hibernate properties
        hibernate:
          show_sql: false
          format_sql: true
          use_sql_comments: false
          generate_statistics: false
          # The following line should be removed once the table is created
          hbm2ddl.auto: update
          # Connection Provider
          connection:
            provider_class: hikaricp
            autocommit: false
          hikari:
            maximumPoolSize: 10
            maxLifetime: 300000
            # we rely on the max lifetime
            idleTimeout: 0
            dataSourceClassName: org.h2.jdbcx.JdbcDataSource
            dataSource:
              url: "jdbc:h2:file:/Users/julianna/java/atoti-spring-boot-template/content-server/mycontent;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE"
            poolName: ContentServer-ConnectionPool
      pivot-integration:
        cache:
          cache-entitlements-ttl: PT1H
      ui-content-integration:
        enabled: true
  # APM properties (https://docs.activeviam.com/products/atoti/server/latest/docs/monitoring/application_performance_monitoring/#properties-exposed)
  apm:
    node:
      starter:
        logging:
          enabled: true
    enable:
      json.queries.service:
        detailed.logging: true
        log.memory.stats: true
      queries.service:
        detailed.logging: true
        log.memory.stats: true
      streaming.service:
        detailed.logging: true
        log.memory.stats: true

springdoc:
  swagger-ui:
    path: /swagger-ui
    doc-expansion: none
