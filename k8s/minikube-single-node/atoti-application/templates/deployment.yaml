apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atoti-application.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atoti-application.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "atoti-application.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atoti-application.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
            {{- if .Values.license }}
          envFrom:
            - secretRef:
                name: {{ include "atoti-application.fullname" . }}-license
            {{- end }}
