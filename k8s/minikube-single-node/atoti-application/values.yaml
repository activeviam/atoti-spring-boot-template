# Default values for atoti-application.
# This is a YAML-formatted file.

image:
  # Set your docker image name and tag here
  repository: "atoti-app"
  tag: "latest"
  pullPolicy: IfNotPresent  # Required when using minikube's Docker daemon

# Paste your base64-encoded Atoti license here.
# It will be injected as the ATOTI_LICENSE environment variable on the pod.
license: ""

service:
  type: NodePort
  port: 9090

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "4Gi"
    cpu: "2"
